name: PR Team Approvals

on:
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Functional and Technical approvals
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_READ_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr_number = context.issue.number;

            // 1. Obtener todas las revisiones del PR
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number: pr_number
            });

            // 2. Filtrar los usuarios que han dado "Approve"
            const latestReviews = {};
            for (const review of reviews) {
              latestReviews[review.user.login] = review.state;
            }
            const approvedUsers = Object.keys(latestReviews).filter(
              user => latestReviews[user] === 'APPROVED'
            );

            let hasFunctional = false;
            let hasTechnical = false;

            // 3. Comprobar si los usuarios que han aprobado pertenecen a los equipos
            for (const user of approvedUsers) {
              if (!hasFunctional) {
                try {
                  const { data: funcMembership } = await github.rest.teams.getMembershipForUserInOrg({
                    org: owner,
                    team_slug: 'functional', // Reemplaza si tu slug es diferente
                    username: user
                  });
                  if (funcMembership.state === 'active') hasFunctional = true;
                } catch (error) {}
              }

              if (!hasTechnical) {
                try {
                  const { data: techMembership } = await github.rest.teams.getMembershipForUserInOrg({
                    org: owner,
                    team_slug: 'technical', // Reemplaza si tu slug es diferente
                    username: user
                  });
                  if (techMembership.state === 'active') hasTechnical = true;
                } catch (error) {}
              }
            }

            // 4. Bloquear o permitir el check del PR
            if (!hasFunctional || !hasTechnical) {
              core.setFailed(`Faltan aprobaciones. Funcional: ${hasFunctional ? '✅' : '❌'} | Técnico: ${hasTechnical ? '✅' : '❌'}`);
            } else {
              core.info('✅ El PR cuenta con la aprobación de un perfil funcional y uno técnico.');
            }
